<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gear Bench">
  <!-- The Detronics ground: full-bleed navy square, rx 12. Identical in every
       app icon in the family; only the subject on top of it changes. -->
  <rect width="64" height="64" rx="12" fill="#1f2d3d"/>

  <!-- Two meshed gears, drawn like real parts rather than in palette colours:
       a steel wheel and a blue pinion, teeth against spaces. -->
  <g transform="translate(25 39)" fill="#c9ccd1">
    <g>
      <rect x="-3.4" y="-18" width="6.8" height="6.5" rx="1"/>
      <rect x="-3.4" y="-18" width="6.8" height="6.5" rx="1" transform="rotate(45)"/>
      <rect x="-3.4" y="-18" width="6.8" height="6.5" rx="1" transform="rotate(90)"/>
      <rect x="-3.4" y="-18" width="6.8" height="6.5" rx="1" transform="rotate(135)"/>
      <rect x="-3.4" y="-18" width="6.8" height="6.5" rx="1" transform="rotate(180)"/>
      <rect x="-3.4" y="-18" width="6.8" height="6.5" rx="1" transform="rotate(225)"/>
      <rect x="-3.4" y="-18" width="6.8" height="6.5" rx="1" transform="rotate(270)"/>
      <rect x="-3.4" y="-18" width="6.8" height="6.5" rx="1" transform="rotate(315)"/>
    </g>
    <circle r="13"/>
    <circle r="4.6" fill="#1f2d3d"/>
  </g>

  <g transform="translate(45.5 20.5)" fill="#7fabc7">
    <g>
      <rect x="-2.6" y="-12.4" width="5.2" height="5" rx="0.8"/>
      <rect x="-2.6" y="-12.4" width="5.2" height="5" rx="0.8" transform="rotate(60)"/>
      <rect x="-2.6" y="-12.4" width="5.2" height="5" rx="0.8" transform="rotate(120)"/>
      <rect x="-2.6" y="-12.4" width="5.2" height="5" rx="0.8" transform="rotate(180)"/>
      <rect x="-2.6" y="-12.4" width="5.2" height="5" rx="0.8" transform="rotate(240)"/>
      <rect x="-2.6" y="-12.4" width="5.2" height="5" rx="0.8" transform="rotate(300)"/>
    </g>
    <circle r="8.6"/>
    <circle r="3.1" fill="#1f2d3d"/>
  </g>
</svg>
